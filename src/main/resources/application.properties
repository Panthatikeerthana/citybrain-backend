spring.application.name=citybrain-backend

# Database Configuration with Environment Variable support
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/citybrain}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:keerthana}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}

# Authentication and JWT Configuration
citybrain.jwt.secret=${JWT_SECRET:${CITYBRAIN_JWT_SECRET:}}
citybrain.jwt.expiration-ms=${CITYBRAIN_JWT_EXPIRATION_MS:86400000}

# Gemini AI Configuration (Server-Side Only)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}

# Live Traffic Telemetry Configuration (Server-Side Only)
traffic.api.key=${TRAFFIC_API_KEY:}


