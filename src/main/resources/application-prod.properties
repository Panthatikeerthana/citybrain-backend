spring.application.name=citybrain-backend

# Production Cloud MySQL Datasource (TiDB, Aiven, Railway, AWS RDS, etc.)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Safe Schema Management (Never drop or re-create production tables)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Dynamic Port Binding (Render, Cloud Run, Railway, etc.)
server.port=${PORT:8080}

# Production JWT Authentication
citybrain.jwt.secret=${JWT_SECRET:${CITYBRAIN_JWT_SECRET:}}
citybrain.jwt.expiration-ms=${CITYBRAIN_JWT_EXPIRATION_MS:86400000}

# Production Gemini AI (Server-Side Only)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}

# Production TomTom Traffic Telemetry (Server-Side Only)
traffic.api.key=${TRAFFIC_API_KEY:}
